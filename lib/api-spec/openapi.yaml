openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: BlackBox Cyber Governance API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Security event log
  - name: risk
    description: Risk scoring and threat state
  - name: breakers
    description: Circuit breaker management
  - name: lockdown
    description: BlackBox Lockdown Protocol
  - name: snapshots
    description: Forensic snapshots
  - name: deception
    description: Deception assets
  - name: incidents
    description: Incident reports
  - name: simulate
    description: Attack simulation
  - name: users
    description: System users and attackers
  - name: trust
    description: Trust graph
  - name: file-access
    description: File IAM policy and trust-adaptive access decisions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List security events (paginated)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: type
          schema: { type: string }
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /risk/score:
    get:
      operationId: getRiskScore
      tags: [risk]
      summary: Current risk score and threat state
      responses:
        "200":
          description: Risk score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskState"

  /risk/history:
    get:
      operationId: getRiskHistory
      tags: [risk]
      summary: Risk score history (last 60 data points)
      responses:
        "200":
          description: History array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskHistoryPoint"

  /breakers:
    get:
      operationId: listBreakers
      tags: [breakers]
      summary: Get all circuit breaker statuses
      responses:
        "200":
          description: Breaker map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakerMap"

  /breakers/{name}/trip:
    post:
      operationId: tripBreaker
      tags: [breakers]
      summary: Manually trip a circuit breaker
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakerTripInput"
      responses:
        "200":
          description: Updated breaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakerState"
        "404":
          description: Not found

  /breakers/{name}/reset:
    post:
      operationId: resetBreaker
      tags: [breakers]
      summary: Reset a circuit breaker
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated breaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakerState"
        "404":
          description: Not found

  /lockdown:
    get:
      operationId: getLockdownState
      tags: [lockdown]
      summary: Get current lockdown state
      responses:
        "200":
          description: Lockdown state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockdownState"

  /lockdown/initiate:
    post:
      operationId: initiateLockdown
      tags: [lockdown]
      summary: Initiate BlackBox Lockdown Protocol
      responses:
        "200":
          description: Lockdown started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockdownState"

  /lockdown/lift:
    post:
      operationId: liftLockdown
      tags: [lockdown]
      summary: Lift lockdown
      responses:
        "200":
          description: Lockdown lifted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockdownState"

  /snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      summary: List forensic snapshots
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SnapshotSummary"

  /snapshots/{id}:
    get:
      operationId: getSnapshot
      tags: [snapshots]
      summary: Get full snapshot detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404":
          description: Not found

  /deception/assets:
    get:
      operationId: listDeceptionAssets
      tags: [deception]
      summary: List deployed deception assets
      responses:
        "200":
          description: Deception asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeceptionAsset"

  /deception/deploy:
    post:
      operationId: deployDeception
      tags: [deception]
      summary: Manually deploy deception assets
      responses:
        "200":
          description: Deployed assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeceptionAsset"

  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List all incidents
      responses:
        "200":
          description: Incident list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentSummary"

  /incidents/{id}/report:
    get:
      operationId: getIncidentReport
      tags: [incidents]
      summary: Get full incident report
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full incident report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentReport"
        "404":
          description: Not found

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all system users with attacker profile data
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /simulate/attack:
    post:
      operationId: simulateAttack
      tags: [simulate]
      summary: Trigger demo attack sequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateAttackInput"
      responses:
        "200":
          description: Simulation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateResult"

  /simulate/reset:
    post:
      operationId: simulateReset
      tags: [simulate]
      summary: Reset all state to baseline
      responses:
        "200":
          description: Reset complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateResult"

  /governance/policies:
    get:
      operationId: listPolicies
      tags: [events]
      summary: List governance policies
      responses:
        "200":
          description: Policy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernancePolicy"

  /governance/trust:
    get:
      operationId: listTrustScores
      tags: [events]
      summary: List user trust scores
      responses:
        "200":
          description: Trust score map
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserTrust"

  /trust/graph:
    get:
      operationId: getTrustGraph
      tags: [trust]
      summary: Get full trust graph (nodes + edges)
      responses:
        "200":
          description: Trust graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustGraph"

  /trust/edges/{id}/sever:
    post:
      operationId: severTrustEdge
      tags: [trust]
      summary: Sever a specific trust path
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated edge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustEdge"
        "404":
          description: Not found

  /trust/analytics:
    get:
      operationId: getTrustAnalytics
      tags: [trust]
      summary: Trust path analytics — active, compromised, severed counts + health %
      responses:
        "200":
          description: Trust analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAnalytics"

  /trust/score:
    get:
      operationId: getTrustScore
      tags: [trust]
      summary: Computed environment-wide trust score
      responses:
        "200":
          description: Trust score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustScore"

  /narrative:
    get:
      operationId: getNarrative
      tags: [events]
      summary: Rule-based AI narrative summary of recent system activity
      responses:
        "200":
          description: Narrative summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NarrativeSummary"

  /assets/classified:
    get:
      operationId: listClassifiedAssets
      tags: [trust]
      summary: List assets with their classification labels
      responses:
        "200":
          description: Classified asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassifiedAsset"

  /file-access/policy:
    get:
      operationId: getFileAccessPolicy
      tags: [file-access]
      summary: Get company file registry, per-user IAM grants, containment, and scoring rules
      responses:
        "200":
          description: File access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAccessPolicy"

  /file-access/attempt:
    post:
      operationId: evaluateFileAccess
      tags: [file-access]
      summary: Evaluate a file access attempt with trust-adaptive threat scoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileAccessAttemptInput"
      responses:
        "200":
          description: Access decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAccessDecision"
        "404":
          description: File not found

  /identity/status:
    get:
      operationId: getIdentityResetStatus
      tags: [lockdown]
      summary: Current Identity Reset Protocol status
      responses:
        "200":
          description: Identity reset status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResetStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SecurityEvent:
      type: object
      required: [id, timestamp, eventType, user, source, details, riskDelta, threatState]
      properties:
        id:         { type: string }
        timestamp:  { type: string }
        eventType:  { type: string }
        user:       { type: string }
        source:     { type: string }
        details:    { type: string }
        riskDelta:  { type: number }
        threatState: { type: string }

    EventList:
      type: object
      required: [events, total]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
        total: { type: integer }

    RiskState:
      type: object
      required: [score, threatState, updatedAt]
      properties:
        score:       { type: number }
        threatState: { type: string }
        updatedAt:   { type: string }

    RiskHistoryPoint:
      type: object
      required: [timestamp, score, threatState]
      properties:
        timestamp:   { type: string }
        score:       { type: number }
        threatState: { type: string }

    BreakerState:
      type: object
      required: [name, status]
      properties:
        name:       { type: string }
        label:      { type: string }
        status:     { type: string }
        trippedAt:  { type: ["string", "null"] }
        reason:     { type: ["string", "null"] }

    BreakerMap:
      type: object
      required: [breakers]
      properties:
        breakers:
          type: array
          items:
            $ref: "#/components/schemas/BreakerState"

    BreakerTripInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    LockdownState:
      type: object
      required: [active, phase, initiatedAt]
      properties:
        active:       { type: boolean }
        phase:        { type: integer }
        initiatedAt:  { type: ["string", "null"] }
        liftedAt:     { type: ["string", "null"] }
        snapshotId:   { type: ["string", "null"] }

    SnapshotSummary:
      type: object
      required: [id, timestamp, triggerRiskScore]
      properties:
        id:               { type: string }
        timestamp:        { type: string }
        triggerRiskScore: { type: number }

    Snapshot:
      type: object
      required: [id, timestamp, triggerRiskScore, memorySnapshot, networkSnapshot, fileSnapshot, userSnapshot]
      properties:
        id:               { type: string }
        timestamp:        { type: string }
        triggerRiskScore: { type: number }
        memorySnapshot:   { type: string }
        networkSnapshot:  { type: string }
        fileSnapshot:     { type: string }
        userSnapshot:     { type: string }

    DeceptionAsset:
      type: object
      required: [id, type, path, deployed, triggered]
      properties:
        id:          { type: string }
        type:        { type: string }
        path:        { type: string }
        deployed:    { type: boolean }
        triggered:   { type: boolean }
        triggeredAt: { type: ["string", "null"] }
        triggeredBy: { type: ["string", "null"] }
        sourceDevice: { type: ["string", "null"] }

    IncidentSummary:
      type: object
      required: [id, startTime, peakRiskScore, threatStateReached, resolved]
      properties:
        id:                { type: string }
        startTime:         { type: string }
        endTime:           { type: ["string", "null"] }
        peakRiskScore:     { type: number }
        threatStateReached: { type: string }
        resolved:          { type: boolean }

    IncidentTimelineEntry:
      type: object
      required: [time, event, significance]
      properties:
        time:         { type: string }
        event:        { type: string }
        significance: { type: string }

    IncidentReport:
      type: object
      required: [incidentId, startTime, peakRiskScore, threatStateReached, timeline, breakersTripped, deceptionTriggered, honeyfilesAccessed, summary]
      properties:
        incidentId:          { type: string }
        startTime:           { type: string }
        endTime:             { type: ["string", "null"] }
        peakRiskScore:       { type: number }
        threatStateReached:  { type: string }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/IncidentTimelineEntry"
        breakersTripped:
          type: array
          items: { type: string }
        deceptionTriggered:  { type: boolean }
        honeyfilesAccessed:
          type: array
          items: { type: string }
        snapshotId:          { type: ["string", "null"] }
        summary:             { type: string }

    SimulateResult:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
        attacker: { type: ["string", "null"] }

    SimulateAttackInput:
      type: object
      required: [attacker, severity]
      properties:
        attacker:
          type: string
          description: Username of the selected attacker to simulate
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: Severity controls the intensity and governance response of the simulation

    User:
      type: object
      required: [id, name, displayName, empId, department, status, riskScore, trustScore, avatar]
      properties:
        id:          { type: string }
        name:        { type: string }
        displayName: { type: string }
        empId:       { type: string }
        department:  { type: string }
        status:      { type: string, enum: [Online, Offline] }
        riskScore:   { type: number }
        trustScore:  { type: number }
        avatar:      { type: string }

    GovernancePolicy:
      type: object
      required: [resource, allowedUsers, maxVolumeMb]
      properties:
        resource:      { type: string }
        allowedUsers:
          type: array
          items: { type: string }
        maxVolumeMb:   { type: number }

    UserTrust:
      type: object
      required: [user, score, lastActivity]
      properties:
        user:         { type: string }
        score:        { type: number }
        lastActivity: { type: string }

    TrustNode:
      type: object
      required: [id, type, name, trustScore, riskState]
      properties:
        id:             { type: string }
        type:           { type: string }
        name:           { type: string }
        trustScore:     { type: number }
        classification: { type: ["string", "null"] }
        riskState:      { type: string }
        createdAt:      { type: ["string", "null"] }

    TrustEdge:
      type: object
      required: [id, fromNodeId, toNodeId, trustScore, severed]
      properties:
        id:          { type: string }
        fromNodeId:  { type: string }
        toNodeId:    { type: string }
        trustScore:  { type: number }
        severed:     { type: boolean }
        severedAt:   { type: ["string", "null"] }
        createdAt:   { type: ["string", "null"] }

    TrustGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TrustNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/TrustEdge"

    TrustAnalytics:
      type: object
      required: [activePaths, compromisedPaths, severedPaths, trustHealthPercent, totalNodes, compromisedNodes, degradedNodes]
      properties:
        activePaths:        { type: integer }
        compromisedPaths:   { type: integer }
        severedPaths:       { type: integer }
        trustHealthPercent: { type: number }
        totalNodes:         { type: integer }
        compromisedNodes:   { type: integer }
        degradedNodes:      { type: integer }

    TrustScore:
      type: object
      required: [score, level, updatedAt]
      properties:
        score:     { type: number }
        level:     { type: string }
        updatedAt: { type: string }

    NarrativeSummary:
      type: object
      required: [summary, generatedAt, eventCount]
      properties:
        summary:      { type: string }
        generatedAt:  { type: string }
        eventCount:   { type: integer }

    ClassifiedAsset:
      type: object
      required: [id, name, type, classification, riskState, trustScore]
      properties:
        id:             { type: string }
        name:           { type: string }
        type:           { type: string }
        classification: { type: string }
        riskState:      { type: string }
        trustScore:     { type: number }

    IdentityResetStatus:
      type: object
      required: [active, progressPercent, completedActions, totalActions, lastRunAt]
      properties:
        active:           { type: boolean }
        progressPercent:  { type: number }
        completedActions:
          type: array
          items: { type: string }
        totalActions:     { type: integer }
        lastRunAt:        { type: ["string", "null"] }
        currentAction:    { type: ["string", "null"] }

    CompanyFile:
      type: object
      required: [id, name, path, department, classification, sizeMb, owner, description]
      properties:
        id:             { type: string }
        name:           { type: string }
        path:           { type: string }
        department:     { type: string }
        classification: { type: string }
        sizeMb:         { type: number }
        owner:          { type: string }
        description:    { type: string }
        createdAt:      { type: string }

    FileAccessGrant:
      type: object
      required: [id, fileId, userName, role, accessLevel, granted]
      properties:
        id:           { type: string }
        fileId:       { type: string }
        userName:     { type: string }
        role:         { type: string }
        accessLevel:  { type: string }
        granted:      { type: boolean }
        createdAt:    { type: string }

    CompanyUserProfile:
      type: object
      required: [userName, displayName, role, department, lastLogin, currentIp, currentLocation, riskStatus, trustScore]
      properties:
        userName:        { type: string }
        displayName:     { type: string }
        role:            { type: string }
        department:      { type: string }
        lastLogin:       { type: string }
        currentIp:       { type: string }
        currentLocation: { type: string }
        riskStatus:      { type: string }
        trustScore:      { type: number }

    FileUserContainment:
      type: object
      required: [userName, active, reason, severedConnections]
      properties:
        userName:            { type: string }
        active:              { type: boolean }
        reason:              { type: string }
        severedConnections:
          type: string
        startedAt:           { type: ["string", "null"] }
        liftedAt:            { type: ["string", "null"] }

    FileAccessAttempt:
      type: object
      required: [id, userName, fileId, action, allowed, device, application, bytesMb, fileCount, indicators, threatScore, effectiveThreatScore, trustBefore, trustAfter, contained, createdAt]
      properties:
        id:                    { type: string }
        userName:              { type: string }
        fileId:                { type: string }
        action:                { type: string }
        allowed:               { type: boolean }
        violationType:         { type: ["string", "null"] }
        device:                { type: string }
        application:           { type: string }
        bytesMb:               { type: number }
        fileCount:             { type: integer }
        indicators:            { type: string }
        threatScore:           { type: number }
        effectiveThreatScore:  { type: number }
        trustBefore:           { type: number }
        trustAfter:            { type: number }
        contained:             { type: boolean }
        createdAt:             { type: string }

    FileAccessAttemptInput:
      type: object
      required: [userName, fileId, action]
      properties:
        userName:    { type: string }
        fileId:      { type: string }
        action:      { type: string }
        device:      { type: string }
        application: { type: string }
        bytesMb:     { type: number }
        fileCount:   { type: integer }

    FileAccessDecision:
      type: object
      required: [allowed, file, grant, attempt, indicators, contained, message]
      properties:
        allowed:  { type: boolean }
        file:
          $ref: "#/components/schemas/CompanyFile"
        grant:
          oneOf:
            - $ref: "#/components/schemas/FileAccessGrant"
            - type: "null"
        attempt:
          $ref: "#/components/schemas/FileAccessAttempt"
        indicators:
          type: array
          items: { type: string }
        contained: { type: boolean }
        message: { type: string }

    FileAccessScoring:
      type: object
      required: [trustBaseline, trustContainmentThreshold, effectiveThreatThreshold, gamma, beta, kappa, rewardRate, lambda, penaltyRates, criticalityCosts]
      properties:
        trustBaseline:               { type: number }
        trustContainmentThreshold:   { type: number }
        effectiveThreatThreshold:   { type: number }
        gamma:                       { type: number }
        beta:                        { type: number }
        kappa:                       { type: number }
        rewardRate:                  { type: number }
        lambda:                      { type: number }
        penaltyRates:
          type: object
          additionalProperties: { type: number }
        criticalityCosts:
          type: object
          additionalProperties: { type: number }

    FileAccessPolicy:
      type: object
      required: [files, grants, containments, attempts, users, profiles, scoring]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/CompanyFile"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/FileAccessGrant"
        containments:
          type: array
          items:
            $ref: "#/components/schemas/FileUserContainment"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/FileAccessAttempt"
        users:
          type: array
          items: { type: string }
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/CompanyUserProfile"
        scoring:
          $ref: "#/components/schemas/FileAccessScoring"

    CommandCenterStatus:
      type: object
      required: [threatScore, trustScore, lockdownActive, identityResetActive, breakersTripped, snapshotCount, deceptionTriggered]
      properties:
        threatScore:          { type: number }
        trustScore:           { type: number }
        threatState:          { type: string }
        lockdownActive:       { type: boolean }
        lockdownPhase:        { type: integer }
        identityResetActive:  { type: boolean }
        breakersTripped:      { type: integer }
        snapshotCount:        { type: integer }
        deceptionTriggered:   { type: integer }
        openIncidents:        { type: integer }
