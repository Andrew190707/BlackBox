kind = "web"
previewPath = "/"
title = "BlackBox"
version = "1.0.0"
id = "artifacts/blackbox"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19147

[services.development]
run = "pnpm --filter @workspace/blackbox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blackbox", "run", "build" ]
publicDir = "artifacts/blackbox/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19147"
BASE_PATH = "/"
